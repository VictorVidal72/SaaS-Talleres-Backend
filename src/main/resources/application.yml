server:
  port: 8080

spring:
  application:
    name: saas-talleres-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/taller_saas_db
    username: saas_admin
    password: saas_secret_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration